plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services' // Firebase plugin
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.manager.shopfastfood"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'  // Phiên bản ổn định
    implementation 'com.google.android.material:material:1.6.0'  // Phiên bản ổn định
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.firebase:firebase-auth:22.1.0'
//    implementation 'androidx.annotation:annotation-jvm:+'
    testImplementation 'junit:junit:4.+'  // Phiên bản ổn định
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'  // Phiên bản ổn định
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'  // Phiên bản ổn định
    //CardView
    implementation 'androidx.cardview:cardview:1.0.0'
    //RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    //Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    //RxJava
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.0.0'
    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation "com.github.akarnokd:rxjava3-retrofit-adapter:3.0.0"
    //Badge
    implementation 'com.nex3z:notification-badge:1.0.4'
    //EventBus
    implementation("org.greenrobot:eventbus:3.3.1")
    //PaperDB
    implementation 'io.github.pilgr:paperdb:2.7.2'
    //Gson
    implementation 'com.google.code.gson:gson:2.8.9'
    //Lottie
    implementation 'com.airbnb.android:lottie:5.2.0'
    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0'
    //Firebase
    implementation platform('com.google.firebase:firebase-bom:32.2.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    //Momo
    implementation 'com.github.momo-wallet:mobile-sdk:1.0.7'
}

apply plugin: 'com.google.gms.google-services'
